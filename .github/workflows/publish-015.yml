name: Publish RASSEG.IA Desktop 0.1.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-015.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar actualización firmada 0.1.5
        run: |
          curl -fL 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-b9c0-8246-9dd8-1e8664e0116b/raw?se=2026-09-19T08%3A16%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=ad5d0b99-2954-5a85-9e37-cf706270b892&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T07%3A21%3A12Z&ske=2026-09-20T07%3A21%3A12Z&sks=b&skv=2026-02-06&sig=Pj7ekGo6UbyJjQ0rLOuHth6YUPsc6ulshAr8GZCaqoE%3D' -o update.zip
          mkdir update
          unzip -o update.zip -d update
          test -f update/latest.json
          test -f update/RASSEGIA-Desktop-Update.exe

      - name: Publicar archivos del canal
        run: |
          mkdir -p rasseg.ia-desktop
          cp update/latest.json rasseg.ia-desktop/latest.json
          cp update/RASSEGIA-Desktop-Update.exe rasseg.ia-desktop/RASSEGIA-Desktop-Update.exe

          git config user.name "RASSEG.IA Update Bot"
          git config user.email "actions@github.com"
          git add rasseg.ia-desktop/latest.json rasseg.ia-desktop/RASSEGIA-Desktop-Update.exe
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Publish RASSEG.IA Desktop 0.1.5"
            git push
          fi
